{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block main_class %}login{% endblock %}
{% block content %}
<form method="post" action="/login" class="card login-card">
  <h1>⇄ Synchro</h1>
  <p class="muted">Administration de la synchronisation MariaDB → PostgreSQL</p>
  <label>Utilisateur <input name="username" autocomplete="username" required autofocus></label>
  <label>Mot de passe <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn primary">Se connecter</button>
</form>
{% endblock %}
