{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block main_class %}login{% endblock %}
{% block content %}
<form method="post" action="/login" class="card login-card">
  <img class="login-logo" src="/static/logo.png" alt="HR Smart Attendance">
  <div>
    <h1 class="sr-only">{{ app_name }}</h1>
    <p class="muted">Bienvenue : connectez-vous pour suivre les pointages et les présences.</p>
  </div>
  <label>E-mail ou identifiant <input name="username" autocomplete="username" required autofocus placeholder="prenom.nom@entreprise.com"></label>
  <label>Mot de passe <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn primary">Se connecter</button>
</form>
{% endblock %}
